<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Other projects — short films, animated series, and TV mixing. Valentyn Chumachenko, VCHAudio."
    />
    <title>Other projects · VCHAudio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css?v=20260714m" />
    <script src="js/nav-arrival.js?v=20260714a"></script>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  </head>
  <body>
    <header class="site-header site-header--center-brand">
      <a class="brand brand--with-vch-mark" href="index.html" aria-label="VCH Audio"><img class="brand-vch-mark" src="assets/vch-mark-transparent.png" width="762" height="330" alt="" decoding="sync" fetchpriority="high" loading="eager" /><span>Audio</span></a>
    </header>

    <main class="page-other-projects">
      <div class="page-hero reveal">
        <div class="page-hero-title-row">
          <nav class="page-back-inline" aria-label="Section navigation">
            <a class="page-back" href="index.html" aria-label="Back to home">
              <span class="page-back-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                  <path d="M15 6l-6 6 6 6" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </span>
            </a>
          </nav>
          <h1>Other projects</h1>
        </div>
        <p class="lead">Animation, broadcast, and selected freelance work outside flagship game credits.</p>
      </div>

      <section class="other-projects-showcase reveal" aria-label="Video work carousel">
        <div class="other-projects-player" id="other-projects-sync" aria-live="polite" aria-atomic="true">
          <p class="other-projects-player__category" id="other-projects-sync-category">Short Movies</p>
          <h2 class="other-projects-player__title" id="other-projects-sync-title">Touching the Skyline</h2>

          <div
            class="other-projects-scroller video-scroller"
            data-video-scroller
            data-other-projects-sync
            aria-label="Other projects — video carousel"
          >
            <button type="button" class="video-scroller__btn video-scroller__btn--prev" aria-label="Scroll previews left">
              <span aria-hidden="true">‹</span>
            </button>
            <div class="video-scroller__viewport">
              <div class="video-scroller__strip">
                <button
                  type="button"
                  class="video-thumb"
                  data-youtube-id="zxH5DS7flZA"
                  data-op-category="Short Movies"
                  data-op-title="Touching the Skyline"
                  data-op-desc="Music and sound design · 2018"
                  aria-label="Play Touching the Skyline on YouTube"
                >
                  <img
                    src="https://img.youtube.com/vi/zxH5DS7flZA/hqdefault.jpg"
                    alt=""
                    width="480"
                    height="360"
                    loading="lazy"
                    decoding="async"
                  />
                </button>
                <button
                  type="button"
                  class="video-thumb"
                  data-youtube-id="WzfrL7wBoW8"
                  data-op-category="Short Movies"
                  data-op-title="The Second Life"
                  data-op-desc="Music and sound design · 2019"
                  aria-label="Play The Second Life on YouTube"
                >
                  <img
                    src="https://img.youtube.com/vi/WzfrL7wBoW8/hqdefault.jpg"
                    alt=""
                    width="480"
                    height="360"
                    loading="lazy"
                    decoding="async"
                  />
                </button>
                <button
                  type="button"
                  class="video-thumb"
                  data-youtube-id="mIOcG_AL5g4"
                  data-op-category="Animation"
                  data-op-title="Chortoviyky"
                  data-op-desc="Sound design, mixing, and mastering · 10 episodes, 25 min each · 2019–2021"
                  aria-label="Play Chortoviyky reel on YouTube"
                >
                  <img
                    src="https://img.youtube.com/vi/mIOcG_AL5g4/hqdefault.jpg"
                    alt=""
                    width="480"
                    height="360"
                    loading="lazy"
                    decoding="async"
                  />
                </button>
                <button
                  type="button"
                  class="video-thumb"
                  data-youtube-id="Cjyw3hssVd8"
                  data-op-category="Broadcast"
                  data-op-title="Discover Destination UA"
                  data-op-desc="Mixing and mastering · 13 episodes, ca. 1 hour · 2020"
                  aria-label="Play Discover Destination UA reel on YouTube"
                >
                  <img
                    src="https://img.youtube.com/vi/Cjyw3hssVd8/hqdefault.jpg"
                    alt=""
                    width="480"
                    height="360"
                    loading="lazy"
                    decoding="async"
                  />
                </button>
              </div>
            </div>
            <button type="button" class="video-scroller__btn video-scroller__btn--next" aria-label="Scroll previews right">
              <span aria-hidden="true">›</span>
            </button>
          </div>

          <p class="other-projects-player__desc" id="other-projects-sync-desc">Music and sound design · 2018</p>
        </div>
      </section>
    </main>

    <div
      id="video-lightbox"
      class="video-lightbox"
      hidden
      role="dialog"
      aria-modal="true"
      aria-label="Video player"
    >
      <div class="video-lightbox__backdrop" data-lightbox-close tabindex="-1"></div>
      <div class="video-lightbox__panel">
        <button type="button" class="video-lightbox__close" data-lightbox-close aria-label="Close video">
          <span aria-hidden="true">×</span>
        </button>
        <div class="video-lightbox__frame">
          <iframe
            id="video-lightbox-iframe"
            title="YouTube video"
            allowfullscreen
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            loading="lazy"
          ></iframe>
        </div>
        <div id="video-lightbox-caption" class="video-lightbox__caption" hidden></div>
      </div>
    </div>

    <button type="button" class="scroll-to-top" data-scroll-to-top aria-label="Back to top">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 7v10M12 7l-5 5M12 7l5 5" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>

    <footer class="site-footer">© VCHAudio · Valentyn Chumachenko</footer>
    <script src="js/main.js?v=20260714d" defer></script>
    <script src="js/deeplink.js?v=20260714g" defer></script>
  </body>
</html>
