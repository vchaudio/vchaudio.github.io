<!DOCTYPE html>
<html lang="en" style="background-color:#0a0908;color-scheme:dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0908" />
    <style>
      html{background-color:#0a0908;color-scheme:dark}
      [data-vch-defer-chrome][hidden]{display:none!important}
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Valentyn Chumachenko — game sound and tech designer, music composer. VCHAudio studio, Odesa Ukraine." />
    <title>Valentyn Chumachenko · VCHAudio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" as="image" href="assets/vch-mark-transparent.png" fetchpriority="high" />
    <link rel="stylesheet" href="css/styles.css?v=20260714m" />
    <link rel="stylesheet" href="css/home.css?v=20260716n" />
    <link rel="stylesheet" href="css/audio-player.css?v=20260713c" />
    <script src="js/nav-arrival.js?v=20260714a"></script>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand brand--with-vch-mark" href="index.html" aria-label="VCH Audio"><img class="brand-vch-mark" src="assets/vch-mark-transparent.png" width="762" height="330" alt="" decoding="sync" fetchpriority="high" loading="eager" /><span>Audio</span></a>
    </header>

    <main id="top" class="home-main" data-home-root data-home-view="main">
      <div class="home-hero">
        <div class="brand-logo-wrap">
          <img class="brand-logo" src="assets/brand-logo.png" width="917" height="239" alt="VCH Audio" loading="eager" />
        </div>
        <div class="avatar-wrap">
          <div class="avatar-ring">
            <div class="avatar-photo-crop">
              <img class="avatar-photo" src="assets/avatar.png" width="400" height="400" alt="Valentyn Chumachenko" />
            </div>
          </div>
        </div>
        <div class="intro-block">
          <h1 class="intro-name"></h1>
          <p class="intro-role"></p>
          <p class="intro-bio"></p>
        </div>
      </div>

      <div class="home-actions">
        <button type="button" class="home-action-btn home-action-btn--resume home-action-btn--pre-puzzle" id="home-toggle-btn" aria-label="Show resume"></button>
      </div>

      <div class="home-panel-wrap">
        <section class="home-panel home-panel--main is-visible" id="home-panel-main" aria-label="Best works">
          <div class="home-panel__inner">
            <div class="best-works-wrap best-works-wrap--pre-puzzle">
            <section class="best-works" aria-labelledby="best-works-heading">
              <h2 id="best-works-heading" class="visually-hidden">Best works</h2>
              <h3 class="best-works__subhead" aria-label="Projects"></h3>
              <div class="best-works__row best-works__row--projects"></div>
              <h3 class="best-works__subhead best-works__subhead--videos" aria-label="Videos"></h3>
              <div class="best-works__videos-block">
                <div class="best-works__row best-works__row--videos"></div>
                <div class="best-works__videos-extra" id="best-works-videos-extra" aria-hidden="true">
                  <div class="best-works__videos-extra-inner"></div>
                </div>
              </div>
            </section>
            </div>
            <footer class="home-bottom home-bottom--pre-puzzle" id="home-bottom">
              <div class="home-actions home-actions--full">
                <button type="button" class="home-action-btn home-action-btn--show-more" id="home-show-more-btn" aria-expanded="false" aria-controls="best-works-videos-extra"></button>
              </div>
            </footer>
            <div class="best-works-tools">
              <h3 class="best-works__subhead best-works__subhead--tools" aria-label="Tools"></h3>
              <div class="best-works__row best-works__row--tools"></div>
            </div>
            <section class="home-recommendations home-recommendations--pre-puzzle" id="home-recommendations" hidden aria-label="Recommendations">
              <h2 class="home-recommendations__heading best-works__subhead"></h2>
              <div class="home-recommendations__carousel">
                <button type="button" class="best-works__carousel-arrow best-works__carousel-arrow--prev home-recommendations__arrow home-recommendations__arrow--prev" hidden aria-label="Previous recommendation">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <div class="home-recommendations__stage">
                  <article class="home-recommendations__card">
                    <div class="home-recommendations__avatar-wrap" hidden>
                      <div class="home-recommendations__avatar-ring">
                        <div class="home-recommendations__avatar-crop">
                          <img class="home-recommendations__avatar" alt="" width="96" height="96" decoding="async" />
                        </div>
                      </div>
                    </div>
                    <div class="home-recommendations__name-wrap"></div>
                    <p class="home-recommendations__meta"></p>
                    <p class="home-recommendations__year"></p>
                    <blockquote class="home-recommendations__quote"></blockquote>
                  </article>
                </div>
                <button type="button" class="best-works__carousel-arrow best-works__carousel-arrow--next home-recommendations__arrow home-recommendations__arrow--next" hidden aria-label="Next recommendation">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
              </div>
            </section>
          </div>
        </section>

        <section class="home-panel home-panel--contact is-hidden" id="home-panel-contact" hidden aria-label="Contact">
          <div class="home-panel__inner">
            <section class="home-contact reveal">
              <p class="home-contact__lead"></p>
              <div class="home-contact__form-wrap">
                <h3 class="home-contact__form-title"></h3>
                <form id="home-connect-form" class="home-connect__form">
                  <div class="home-connect__field">
                    <label for="connect-email"></label>
                    <input type="email" id="connect-email" name="email" autocomplete="email" />
                  </div>
                  <div class="home-connect__field">
                    <label for="connect-name"></label>
                    <input type="text" id="connect-name" name="name" autocomplete="name" />
                  </div>
                  <div class="home-connect__field">
                    <label for="connect-subject"></label>
                    <input type="text" id="connect-subject" name="subject" autocomplete="off" />
                  </div>
                  <div class="home-connect__field home-connect__field--message">
                    <label for="connect-message"></label>
                    <div class="home-connect__message-wrap">
                      <textarea id="connect-message" name="message"></textarea>
                      <button type="button" class="home-connect__resize-handle" aria-label="Resize message field" tabindex="-1"></button>
                    </div>
                  </div>
                  <p class="home-connect__status" data-connect-status aria-live="polite"></p>
                  <button type="submit" class="home-action-btn home-connect__submit"></button>
                </form>
              </div>
            </section>
          </div>
        </section>

        <section class="home-panel home-panel--resume is-hidden" id="home-panel-resume" hidden aria-label="Resume">
          <div class="home-panel__inner">
            <div class="home-tabs" role="tablist" aria-label="Resume sections" data-home-tablist="resume">
              <button type="button" class="home-tab" role="tab" id="home-tab-btn-resume" aria-selected="true" aria-controls="home-tab-panel-resume" data-home-tab="resume">Resume</button>
              <button type="button" class="home-tab" role="tab" id="home-tab-btn-studio" aria-selected="false" aria-controls="home-tab-panel-studio" data-home-tab="studio" tabindex="-1">My Studio</button>
            </div>

            <div id="home-tab-panel-resume" class="home-tab-panel" role="tabpanel" aria-labelledby="home-tab-btn-resume"></div>

            <div id="home-tab-panel-studio" class="home-tab-panel" role="tabpanel" aria-labelledby="home-tab-btn-studio" hidden>
              <div class="home-tab-studio studio-page">
                <p class="home-tab-studio__lead"></p>
                <section class="studio-gallery reveal" aria-label="Studio photos">
                  <div class="video-scroller studio-gallery__carousel" data-video-scroller aria-label="Studio photo carousel">
                    <button type="button" class="video-scroller__btn video-scroller__btn--prev" aria-label="Scroll photos left">
                      <span aria-hidden="true">‹</span>
                    </button>
                    <div class="video-scroller__viewport">
                      <div class="video-scroller__strip"></div>
                    </div>
                    <button type="button" class="video-scroller__btn video-scroller__btn--next" aria-label="Scroll photos right">
                      <span aria-hidden="true">›</span>
                    </button>
                  </div>
                </section>
                <div class="studio-gear-grid reveal"></div>
              </div>
            </div>

          </div>
        </section>

      </div>
    </main>

    <div id="video-lightbox" class="video-lightbox" hidden role="dialog" aria-modal="true" aria-label="Video player">
      <div class="video-lightbox__backdrop" data-lightbox-close tabindex="-1"></div>
      <div class="video-lightbox__panel">
        <button type="button" class="video-lightbox__close" data-lightbox-close aria-label="Close video">
          <span aria-hidden="true">×</span>
        </button>
        <div class="video-lightbox__frame">
          <iframe id="video-lightbox-iframe" title="YouTube video" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" loading="lazy"></iframe>
        </div>
        <div id="video-lightbox-caption" class="video-lightbox__caption" hidden></div>
      </div>
    </div>

    <div id="image-lightbox" class="image-lightbox" hidden role="dialog" aria-modal="true" aria-label="Enlarged photo">
      <div class="image-lightbox__backdrop" data-image-lightbox-close tabindex="-1" aria-hidden="true"></div>
      <button type="button" class="image-lightbox__close" data-image-lightbox-close aria-label="Close photo">
        <span aria-hidden="true">×</span>
      </button>
      <button type="button" class="image-lightbox__nav image-lightbox__nav--prev" data-lb-prev aria-label="Previous photo" hidden>
        <span aria-hidden="true">‹</span>
      </button>
      <button type="button" class="image-lightbox__nav image-lightbox__nav--next" data-lb-next aria-label="Next photo" hidden>
        <span aria-hidden="true">›</span>
      </button>
      <div id="image-lightbox-stage" class="image-lightbox__stage">
        <div id="image-lightbox-track" class="image-lightbox__track">
          <div class="image-lightbox__frame">
            <img id="image-lightbox-img" class="image-lightbox__img" src="" alt="" decoding="async" draggable="false" />
          </div>
          <div class="image-lightbox__frame">
            <img id="image-lightbox-img-next" class="image-lightbox__img" alt="" aria-hidden="true" decoding="async" draggable="false" />
          </div>
        </div>
      </div>
      <p id="image-lightbox-counter" class="image-lightbox__counter" hidden aria-live="polite"></p>
    </div>

    <button type="button" class="scroll-to-top" data-scroll-to-top aria-label="Back to top">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 7v10M12 7l-5 5M12 7l5 5" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>

    <footer class="site-footer site-footer--home" data-vch-defer-chrome hidden>
      <div class="home-footer-social" id="home-footer-social">
        <div class="home-social__icons">
          <a
            class="home-social-btn home-social-btn--icon"
            href="https://www.linkedin.com/in/vchaudio/"
            rel="me noopener noreferrer"
            target="_blank"
            aria-label="LinkedIn profile"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20.5 2h-17A1.5 1.5 0 002 3.5v17A1.5 1.5 0 003.5 22h17a1.5 1.5 0 001.5-1.5v-17A1.5 1.5 0 0020.5 2zM8 19H5v-9h3zM6.5 8.25A1.75 1.75 0 118.3 6.5a1.78 1.78 0 01-1.8 1.75zM19 19h-3v-4.74c0-1.42-.6-1.93-1.38-1.93A1.65 1.65 0 0013 14.19a.66.66 0 000 .14V19h-3v-9h2.77v1.21h.04a3.11 3.11 0 012.7-1.48c1.78 0 3.16 1.16 3.16 3.61z" />
            </svg>
          </a>
          <button type="button" class="home-social-btn home-social-btn--icon" id="home-mail-btn" aria-label="Mail to me" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z" />
            </svg>
          </button>
        </div>
      </div>
      <p class="site-footer__copy"></p>
    </footer>

    <noscript>
      <p style="padding:2rem;text-align:center">This site requires JavaScript to display content.</p>
    </noscript>
    <script src="js/render.js?v=20260716m" defer></script>
  </body>
</html>
